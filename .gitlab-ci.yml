stages:
  - verify

default:
  tags:
    - win10
  interruptible: true

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

quality:
  stage: verify
  timeout: 15m
  script:
    - $ErrorActionPreference = "Stop"
    - (Get-Command node -ErrorAction Stop).Source
    - (Get-Command npm -ErrorAction Stop).Source
    - node --version
    - npm --version
    - npm ci --no-audit --no-fund
    - npm run check
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - dist/
      - storybook-static/
