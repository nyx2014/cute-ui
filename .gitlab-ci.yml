stages:
  - verify

default:
  tags:
    - ubuntu
  interruptible: true

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

quality:
  stage: verify
  timeout: 15m
  script:
    - command -v node
    - command -v npm
    - node --version
    - npm --version
    - npm ci --no-audit --no-fund
    - npm run check
  artifacts:
    when: on_success
    expire_in: 7 days
    paths:
      - dist/
      - storybook-static/
